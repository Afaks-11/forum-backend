# build command: docker compose --env-file .env.docker up --build 
services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: production

    container_name: forum_api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER?POSTGRES_USER  is required}:${POSTGRES_PASSWORD?POSTGRES_PASSWORD is required}@forum-postgres:5432/${POSTGRES_DB?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD?REDIS_PASSWORD is required}@forum-redis:6379  

      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET?JWT_ACCESS_TOKEN_SECRET is required}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET?JWT_REFRESH_TOKEN_SECRET is required}
      
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET?CLOUDINARY_API_SECRET is required}
      
      BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME?BULL_BOARD_USERNAME is required}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD?BULL_BOARD_PASSWORD is required}
      
      SMTP_USER: ${SMTP_USER?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS?SMTP_PASS is required}
      SMTP_FROM: ${SMTP_FROM?SMTP_FROM is required}
      
      CORS_ORIGINS: ${CORS_ORIGINS?CORS_ORIGINS is required}

      ADMIN_REGISTRATION_SECRET: ${ADMIN_REGISTRATION_SECRET?ADMIN_REGISTRATION_SECRET is required}

    ports:
      - "${API_PORT}:3000"
    depends_on:
      forum-postgres:
        condition: service_healthy
      forum-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  forum-postgres:
    image: postgres:17-alpine
    container_name: forum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum_password}
      POSTGRES_DB: ${POSTGRES_DB:-forum_db}
    volumes:
      - forum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  forum-redis:
    image: redis:7-alpine
    container_name: forum-redis
    restart: unless-stopped
    # Append-only persistence so queued BullMQ jobs survive a container restart.
    command: 
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      -  yes
    volumes:
      - forum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  forum_postgres_data:
  forum_redis_data:
