
services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: production
    container_name: forum_api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-forum_user}:${POSTGRES_PASSWORD:-forum_password}@forum-postgres:5432/${POSTGRES_DB:-forum_db}?schema=public
      REDIS_URL: redis://forum-redis:6379
    ports:
      - "${API_PORT:-5000}:3000"
    depends_on:
      forum-postgres:
        condition: service_healthy
      forum-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  forum-postgres:
    image: postgres:17-alpine
    container_name: forum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum_password}
      POSTGRES_DB: ${POSTGRES_DB:-forum_db}
    ports:
      - "127.0.0.1:${DB_EXPOSED_PORT:-5433}:5432"
    volumes:
      - forum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-forum_user} -d ${POSTGRES_DB:-forum_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  forum-redis:
    image: redis:7-alpine
    container_name: forum-redis
    restart: unless-stopped
    # Append-only persistence so queued BullMQ jobs survive a container restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_EXPOSED_PORT:-6380}:6379"
    volumes:
      - forum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  forum_postgres_data:
  forum_redis_data:
